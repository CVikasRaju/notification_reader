# Builds a release APK and attaches it to a GitHub Release.
#
# Triggered when a version tag (v*) is pushed, or manually from the Actions tab.
#
# Release signing:
#   Add these repo secrets (Settings -> Secrets and variables -> Actions) to
#   sign with your real keystore in CI:
#     KEYSTORE_BASE64   - your keystore file base64-encoded, e.g.:
#                         base64 -w 0 android/upload-keystore.jks
#     KEYSTORE_PASSWORD - the store/key password from android/key.properties
#     KEY_ALIAS         - the key alias (default: upload)
#   Without secrets, the workflow still builds an APK signed with the debug
#   key (fine for testing; not for distributing updates to others).

name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer and tests
        run: |
          flutter analyze
          flutter test

      - name: Configure release signing from secrets
        # The `secrets` context cannot be referenced inside an `if:` condition
        # (GitHub rejects the workflow file), so guard inside the script via
        # the environment variables instead.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (skip if already uploaded)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub does not auto-create a release for a pushed tag, so make
          # sure one exists before uploading. Then attach the APK, but never
          # clobber an APK already on the release (e.g. uploaded manually from
          # a properly signed local build) with the CI build, which is
          # debug-signed when the keystore secrets are not configured.
          if ! gh api \
              "repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" \
              >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "${{ github.repository }}" --generate-notes
          fi
          if gh api \
              "repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" \
              --jq '.assets[].name' 2>/dev/null | grep -qx 'app-release.apk'; then
            echo 'app-release.apk already exists on the release; skipping upload.'
          else
            gh release upload "$GITHUB_REF_NAME" \
              build/app/outputs/flutter-apk/app-release.apk \
              --repo "${{ github.repository }}"
          fi
